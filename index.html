<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora Mamma Mia!</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <div class="calc">
        <header class="header">
          <h2>Sistema Mamma Mia 🇮🇹 Base 21</h2>
        </header>

        <div class="display" id="display">0</div>

        <section class="result">
          <div>Decimal: <span id="dec">0</span></div>
          <div>Binário: <span id="bin">00000</span></div>
          <div>Hexadecimal: <span id="hex">0</span></div>
          <div>Octal: <span id="oct">0</span></div>
          <div>Mamma Mia: <span id="ita">A</span></div>
        </section>

        <section class="grid" id="teclado"></section>
      </div>
    </main>
  </body>
</html>
