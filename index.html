<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Mamma Mia!</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<div class="calc">
  <h2>🧮 Mamma Mia - Base 21</h2>

  <div class="display" id="display">0</div>

  <div class="result">
    <div>Decimal: <span id="dec">0</span></div>
    <div>Binário: <span id="bin">00000</span></div>
    <div>Mamma Mia: <span id="ita">A</span></div>
  </div>

  <div class="grid" id="teclado"></div>
</div>

</body>
</html>
